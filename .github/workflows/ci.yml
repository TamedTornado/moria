name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Documentation tests
        run: cargo test --doc --all-features
      - name: Shader validation
        run: cargo run --bin moria-qualify -- shaders validate
      - name: Replay scaffold reports unavailable
        shell: bash
        run: |
          if output="$(cargo run --bin moria-qualify -- replay verify --fixture fixtures/replay/core-v1 --runs 8 --evidence target/moria-evidence/replay 2>&1)"; then
            printf '%s\n' "$output"
            echo 'expected replay scaffold verification to be unavailable' >&2
            exit 1
          fi
          printf '%s\n' "$output"
          case "$output" in
            *'FAIL replay verify: UNAVAILABLE:'*) ;;
            *)
              echo 'replay scaffold did not report the expected UNAVAILABLE outcome' >&2
              exit 1
              ;;
          esac
      - name: Candidate scenario scaffold reports unavailable
        shell: bash
        run: |
          if output="$(cargo run --bin moria-qualify -- scenario public-boundary --mode candidate --evidence target/moria-evidence/dev 2>&1)"; then
            printf '%s\n' "$output"
            echo 'expected candidate scenario scaffold to be unavailable' >&2
            exit 1
          fi
          printf '%s\n' "$output"
          case "$output" in
            *'FAIL scenario public-boundary: UNAVAILABLE:'*) ;;
            *)
              echo 'candidate scenario scaffold did not report the expected UNAVAILABLE outcome' >&2
              exit 1
              ;;
          esac
