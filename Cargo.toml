[package]
name = "moria"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Deterministic sparse material-world infrastructure for Bevy applications."
license = "MIT OR Apache-2.0"

[lib]
name = "moria"
path = "src/lib.rs"

[[bin]]
name = "moria-qualify"
path = "src/bin/moria-qualify/main.rs"

[features]
default = ["bevy", "persistence-zstd", "presentation"]
bevy = ["dep:bevy"]
persistence-zstd = ["dep:zstd"]
presentation = ["bevy"]

[dependencies]
# `arc-slice` provides the fallible shared allocation required by `OwnedBytes`.
# Its MIT license is compatible with Moria, default OOM-handling is disabled,
# and its allocation-only implementation has no platform or wasm assumptions.
arc-slice = { version = "=0.1.0", default-features = false, features = ["std"] }
bevy = { version = "=0.19.0", default-features = false, optional = true }
naga = { version = "=29.0.1", default-features = false, features = ["wgsl-in"] }
wgpu = { version = "=29.0.3", default-features = false }
zstd = { version = "=0.13.3", optional = true }

[lints.rust]
unsafe_code = "forbid"
